<!DOCTYPE html>
<html lang="ms">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Jadual PDPR 2026 | SR Ar Raudhah</title>

  <meta
    name="description"
    content="Jadual PDPR 2026 SR Ar Raudhah"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #f8fafc 0%,
          #eef4f8 100%
        );

      color: #172033;
    }


    /* =========================================
       HEADER
       ========================================= */

    .header {
      padding: 34px 20px 28px;

      background:
        linear-gradient(
          135deg,
          #063b2b,
          #0a6b4d
        );

      color: white;

      text-align: center;

      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.12);
    }

    .school {
      font-size: 13px;
      font-weight: 700;

      letter-spacing: 1.8px;

      opacity: 0.85;

      text-transform: uppercase;
    }
    
    .logo {
      width: 85px;
      height: 85px;
      object-fit: contain;
      display: block;
      margin: 0 auto 12px;
    
      filter: drop-shadow(
        0 4px 8px rgba(0, 0, 0, 0.15)
      );
    }

    .title {
      margin: 8px 0 5px;

      font-size: clamp(27px, 6vw, 42px);

      font-weight: 800;

      letter-spacing: -1px;
    }

    .subtitle {
      margin: 0;

      font-size: 14px;

      opacity: 0.82;
    }


    /* =========================================
       MAIN
       ========================================= */

    .container {
      width: min(760px, calc(100% - 28px));

      margin: 0 auto;

      padding: 25px 0 50px;
    }


    /* =========================================
       YEAR SELECTOR
       ========================================= */

    .selector-card {

      background: white;

      border-radius: 20px;

      padding: 20px;

      box-shadow:
        0 8px 30px rgba(15, 23, 42, 0.07);

      border: 1px solid #e5eaf0;

      margin-bottom: 20px;
    }

    .selector-label {

      display: block;

      margin-bottom: 9px;

      font-size: 13px;

      font-weight: 700;

      color: #64748b;

      text-transform: uppercase;

      letter-spacing: 0.7px;
    }

    select {

      width: 100%;

      border: 2px solid #dce4eb;

      border-radius: 14px;

      padding: 15px 16px;

      font-size: 16px;

      font-weight: 700;

      color: #172033;

      background: white;

      outline: none;

      cursor: pointer;

      appearance: auto;
    }

    select:focus {
      border-color: #087f5b;
    }


    /* =========================================
       LOADING
       ========================================= */

    .loading {

      display: none;

      text-align: center;

      padding: 30px 10px;

      color: #64748b;
    }

    .loading.show {
      display: block;
    }

    .spinner {

      width: 30px;
      height: 30px;

      border: 3px solid #dbe5e1;

      border-top-color: #087f5b;

      border-radius: 50%;

      animation: spin 0.8s linear infinite;

      margin: 0 auto 12px;
    }

    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }


    /* =========================================
       ERROR
       ========================================= */

    .message {

      display: none;

      background: white;

      border-radius: 18px;

      padding: 30px 20px;

      text-align: center;

      border: 1px solid #e5eaf0;

      box-shadow:
        0 8px 30px rgba(15, 23, 42, 0.06);

      color: #64748b;
    }

    .message.show {
      display: block;
    }

    .message-icon {
      font-size: 35px;
      margin-bottom: 10px;
    }

    .message-title {

      font-size: 18px;

      font-weight: 800;

      color: #172033;

      margin-bottom: 5px;
    }


    /* =========================================
       DAY HEADER
       ========================================= */

    .day-card {

      display: none;

      background: white;

      border-radius: 20px;

      padding: 20px;

      margin-bottom: 18px;

      border: 1px solid #e5eaf0;

      box-shadow:
        0 8px 30px rgba(15, 23, 42, 0.07);
    }

    .day-card.show {
      display: block;
    }

    .class-name {

      font-size: 24px;

      font-weight: 800;

      color: #063b2b;

      margin-bottom: 8px;
    }

    .date-info {

      display: flex;

      flex-wrap: wrap;

      gap: 8px;
    }

    .date-badge {

      display: inline-flex;

      align-items: center;

      padding: 7px 11px;

      border-radius: 999px;

      background: #edf7f3;

      color: #087f5b;

      font-size: 13px;

      font-weight: 700;
    }


    /* =========================================
       SESSION
       ========================================= */

    .sessions {
      display: flex;

      flex-direction: column;

      gap: 13px;
    }

    .session {

      background: white;

      border: 1px solid #e4e9ee;

      border-radius: 19px;

      overflow: hidden;

      box-shadow:
        0 5px 22px rgba(15, 23, 42, 0.055);
    }

    .session-top {

      padding: 16px 17px 13px;

      background:
        linear-gradient(
          135deg,
          #f8fafc,
          #f1f7f4
        );

      border-bottom: 1px solid #e8edf0;
    }

    .session-name {

      font-size: 16px;

      font-weight: 800;

      color: #172033;

      margin-bottom: 5px;
    }

    .session-time {

      font-size: 13px;

      color: #087f5b;

      font-weight: 700;
    }

    .session-body {

      padding: 15px 17px 17px;
    }


    /* =========================================
       SUBJECT
       ========================================= */

    .subject {

      font-size: 20px;

      font-weight: 800;

      color: #111827;

      margin-bottom: 11px;
    }


    /* =========================================
       TEACHER
       ========================================= */

    .teacher {

      display: flex;

      align-items: center;

      gap: 8px;

      color: #64748b;

      font-size: 14px;

      margin-bottom: 15px;
    }

    .teacher-icon {

      width: 29px;
      height: 29px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #edf7f3;

      color: #087f5b;

      font-size: 14px;
    }


    /* =========================================
       GOOGLE MEET BUTTON
       ========================================= */

    .meet-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 52px;
      border-radius: 14px;
    
      background: #087f5b;
      color: white;
    
      text-decoration: none;
      font-size: 15px;
      font-weight: 800;
    
      transition:
        transform 0.15s ease,
        background 0.15s ease,
        box-shadow 0.15s ease;
    
      box-shadow:
        0 5px 15px rgba(8, 127, 91, 0.2);
    }
    
    
    /* MATHURAT - BLUE GOOGLE MEET BUTTON */
    /* MATHURAT - ORANGE GOOGLE MEET BUTTON */
    .meet-button.mathurat {
      background: #f59e0b;
    
      box-shadow:
        0 5px 15px rgba(245, 158, 11, 0.20);
    }
    
    /* MATHURAT HOVER */
    .meet-button.mathurat:hover {
      background: #d97706;
    
      box-shadow:
        0 8px 20px rgba(245, 158, 11, 0.25);
    }
    
    
    /* MATHURAT HOVER */
    .meet-button.mathurat:hover {
      background: #1d4ed8;
    
      box-shadow:
        0 8px 20px rgba(37, 99, 235, 0.25);
    }
    
    
    .meet-button:active {
      transform: scale(0.98);
    }

    .meet-icon {

      margin-right: 8px;

      font-size: 18px;
    }


    /* =========================================
       NO LINK
       ========================================= */

    .no-link {

      padding: 12px;

      border-radius: 12px;

      background: #f8fafc;

      color: #94a3b8;

      text-align: center;

      font-size: 13px;

      font-weight: 600;
    }


    /* =========================================
       FOOTER
       ========================================= */

    .footer {

      text-align: center;

      padding: 15px 10px;

      color: #94a3b8;

      font-size: 12px;
    }


    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 480px) {

      .header {
        padding: 28px 16px 24px;
      }

      .container {
        width: min(100% - 20px, 760px);

        padding-top: 18px;
      }

      .selector-card {
        padding: 16px;
        border-radius: 17px;
      }

      .day-card {
        padding: 17px;
        border-radius: 17px;
      }

      .class-name {
        font-size: 22px;
      }

      .session {
        border-radius: 17px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================================
       HEADER
       ========================================= -->

  <header class="header">

      <img
        src="https://raw.githubusercontent.com/julf95/classroom/main/Logo%20Raudhah.png"
        alt="Logo SR Ar Raudhah"
        class="logo"
      >
    
      <div class="school">
        SEKOLAH RENDAH AR RAUDHAH
      </div>
    
      <h1 class="title">
        Jadual PDPR 2026
      </h1>
    
      <p class="subtitle">
        "Pembelajaran Dalam Talian"
      </p>
    
    </header>


  <main class="container">


    <!-- =========================================
         YEAR SELECTOR
         ========================================= -->

    <section class="selector-card">

      <label
        class="selector-label"
        for="tahunSelect"
      >
        Pilih Tahun
      </label>

      <select id="tahunSelect">

        <option value="">
          -- Pilih Tahun --
        </option>

        <option value="1">
          Tahun 1
        </option>

        <option value="2">
          Tahun 2
        </option>

        <option value="3">
          Tahun 3
        </option>

        <option value="4">
          Tahun 4
        </option>

        <option value="5">
          Tahun 5
        </option>


      </select>

    </section>


    <!-- =========================================
         LOADING
         ========================================= -->

    <div
      id="loading"
      class="loading"
    >

      <div class="spinner"></div>

      <div>
        Sedang memuatkan jadual...
      </div>

    </div>


    <!-- =========================================
         MESSAGE
         ========================================= -->

    <div
      id="message"
      class="message"
    >

      <div
        id="messageIcon"
        class="message-icon"
      >
        📅
      </div>

      <div
        id="messageTitle"
        class="message-title"
      >
        Jadual belum tersedia
      </div>

      <div id="messageText">
        Sila pilih tahun yang lain.
      </div>

    </div>


    <!-- =========================================
         DAY / CLASS
         ========================================= -->

    <section
      id="dayCard"
      class="day-card"
    >

      <div
        id="className"
        class="class-name"
      >
        TAHUN 1
      </div>

      <div class="date-info">

        <span
          id="dayBadge"
          class="date-badge"
        >
          ISNIN
        </span>

        <span
          id="dateBadge"
          class="date-badge"
        >
          5 OKTOBER 2026
        </span>

      </div>

    </section>


    <!-- =========================================
         SESSIONS
         ========================================= -->

    <div
      id="sessions"
      class="sessions"
    ></div>


    <div class="footer">

      Jadual PDPR 2026 · SR Ar Raudhah

    </div>


  </main>


  <script>

    /*
     * =====================================================
     * IMPORTANT
     *
     * Paste your Apps Script Web App URL here.
     * =====================================================
     */

    const API_URL =
      'https://script.google.com/macros/s/AKfycbywivX93mBgSGxm_kqx5RQnPPDPclZowOFp_Q-vxZkh_CTU_rQNmqYNdlo-tsysyCeIVQ/exec';


    const tahunSelect =
      document.getElementById('tahunSelect');

    const loading =
      document.getElementById('loading');

    const message =
      document.getElementById('message');

    const messageIcon =
      document.getElementById('messageIcon');

    const messageTitle =
      document.getElementById('messageTitle');

    const messageText =
      document.getElementById('messageText');

    const dayCard =
      document.getElementById('dayCard');

    const className =
      document.getElementById('className');

    const dayBadge =
      document.getElementById('dayBadge');

    const dateBadge =
      document.getElementById('dateBadge');

    const sessions =
      document.getElementById('sessions');


    /*
     * =====================================================
     * YEAR CHANGE
     * =====================================================
     */

    tahunSelect.addEventListener(
      'change',
      function () {

        const tahun = this.value;

        if (!tahun) {

          resetPage();

          return;

        }

        loadSchedule(tahun);

      }
    );


    /*
     * =====================================================
     * RESET
     * =====================================================
     */

    function resetPage() {

      loading.classList.remove('show');

      message.classList.remove('show');

      dayCard.classList.remove('show');

      sessions.innerHTML = '';

    }


    /*
     * =====================================================
     * LOAD SCHEDULE
     *
     * JSONP is used because this website is hosted
     * on GitHub while the API is hosted by Apps Script.
     * =====================================================
     */

    function loadSchedule(tahun) {

      resetPage();

      loading.classList.add('show');

      const callbackName =
        'pdprCallback_' +
        Date.now();

      window[callbackName] =
        function (data) {

          try {

            displaySchedule(data);

          } finally {

            loading.classList.remove('show');

            delete window[callbackName];

          }

        };


      const script =
        document.createElement('script');


      script.src =
        API_URL +
        '?tahun=' +
        encodeURIComponent(tahun) +
        '&callback=' +
        encodeURIComponent(callbackName);


      script.onerror =
        function () {

          loading.classList.remove('show');

          showMessage(
            '⚠️',
            'Tidak dapat memuatkan jadual',
            'Sila cuba semula sebentar lagi.'
          );

          delete window[callbackName];

        };


      document.body.appendChild(script);

    }


    /*
     * =====================================================
     * DISPLAY DATA
     * =====================================================
     */

    function displaySchedule(data) {

      if (!data || !data.success) {

        showMessage(
          '📅',
          'Jadual belum tersedia',
          data && data.message
            ? data.message
            : 'Jadual belum tersedia.'
        );

        return;

      }


      /*
       * Class / date
       */

      className.textContent =
        data.kelas || ('TAHUN ' + data.tahun);

      dayBadge.textContent =
        data.hari || 'HARI BELUM DITETAPKAN';

      dateBadge.textContent =
        data.tarikh || 'TARIKH BELUM DITETAPKAN';

      dayCard.classList.add('show');


      /*
       * Sessions
       */

      sessions.innerHTML = '';


      if (
        !data.sessions ||
        data.sessions.length === 0
      ) {

        showMessage(
          '📚',
          'Tiada jadual',
          'Belum ada sesi PDPR yang diisi untuk tahun ini.'
        );

        return;

      }


      data.sessions.forEach(
        function (session) {

          sessions.appendChild(
            createSessionCard(session)
          );

        }
      );

    }


    /*
     * =====================================================
     * CREATE SESSION CARD
     * =====================================================
     */

    function createSessionCard(session) {

      const card =
        document.createElement('article');

      card.className = 'session';


      /*
       * TOP
       */

      const top =
        document.createElement('div');

      top.className = 'session-top';


      const name =
        document.createElement('div');

      name.className = 'session-name';

      name.textContent =
        session.name || 'Sesi PDPR';


      const time =
        document.createElement('div');

      time.className = 'session-time';

      time.textContent =
        session.time || '';


      top.appendChild(name);

      top.appendChild(time);


      /*
       * BODY
       */

      const body =
        document.createElement('div');

      body.className = 'session-body';


      /*
       * SUBJECT
       */

      if (session.subject) {

        const subject =
          document.createElement('div');

        subject.className = 'subject';

        subject.textContent =
          session.subject;

        body.appendChild(subject);

      }


      /*
       * TEACHER
       */

      if (session.teacher) {

        const teacher =
          document.createElement('div');

        teacher.className = 'teacher';


        const icon =
          document.createElement('div');

        icon.className =
          'teacher-icon';

        icon.textContent =
          '👤';


        const teacherText =
          document.createElement('span');

        teacherText.textContent =
          session.teacher;


        teacher.appendChild(icon);

        teacher.appendChild(teacherText);

        body.appendChild(teacher);

      }


      /*
       * GOOGLE MEET
       */

      if (session.meetLink) {

        const button =
          document.createElement('a');

        button.className = 'meet-button';

        if (
          session.name &&
          session.name.toUpperCase().includes('MATHURAT')
        ) {
          button.classList.add('mathurat');
        }

        button.href =
          session.meetLink;

        button.target =
          '_blank';

        button.rel =
          'noopener noreferrer';


        const icon =
          document.createElement('span');

        icon.className =
          'meet-icon';

        icon.textContent =
          '🎥';


        const text =
          document.createElement('span');

        text.textContent =
          'JOIN GOOGLE MEET';


        button.appendChild(icon);

        button.appendChild(text);

        body.appendChild(button);

      } else {

        const noLink =
          document.createElement('div');

        noLink.className =
          'no-link';

        noLink.textContent =
          'Pautan Google Meet belum tersedia.';

        body.appendChild(noLink);

      }


      card.appendChild(top);

      card.appendChild(body);

      return card;

    }


    /*
     * =====================================================
     * MESSAGE
     * =====================================================
     */

    function showMessage(
      icon,
      title,
      text
    ) {

      messageIcon.textContent =
        icon;

      messageTitle.textContent =
        title;

      messageText.textContent =
        text;

      message.classList.add('show');

    }

  </script>

</body>

</html>

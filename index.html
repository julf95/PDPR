<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Jadual PDPR 2026 | SR Ar Raudhah</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f3f6fa;
  color: #172033;
}

/* =========================
   HEADER
========================= */

.header {
  background: linear-gradient(135deg, #123c69, #1769aa);
  color: white;
  padding: 28px 18px 32px;
  text-align: center;
}

.header h1 {
  margin: 0;
  font-size: 27px;
  font-weight: 800;
}

.header p {
  margin: 7px 0 0;
  font-size: 14px;
  opacity: .9;
}

/* =========================
   MAIN
========================= */

.container {
  max-width: 1000px;
  margin: auto;
  padding: 22px 15px 50px;
}

/* =========================
   YEAR SELECTOR
========================= */

.selector-card {
  background: white;
  border-radius: 18px;
  padding: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,.06);
  margin-bottom: 20px;
}

.selector-card label {
  display: block;
  font-weight: 700;
  margin-bottom: 9px;
}

select {
  width: 100%;
  padding: 14px 15px;
  border: 1px solid #d6dce5;
  border-radius: 12px;
  background: white;
  font-size: 16px;
  outline: none;
}

select:focus {
  border-color: #1769aa;
}

/* =========================
   LOADING
========================= */

.loading {
  text-align: center;
  padding: 35px 10px;
  color: #64748b;
  display: none;
}

.spinner {
  width: 30px;
  height: 30px;
  border: 3px solid #dbe5ef;
  border-top-color: #1769aa;
  border-radius: 50%;
  animation: spin .8s linear infinite;
  margin: 0 auto 12px;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* =========================
   DATE SECTION
========================= */

.day-card {
  background: white;
  border-radius: 18px;
  margin-bottom: 18px;
  overflow: hidden;
  box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.day-header {
  background: #eaf3fb;
  padding: 16px 18px;
  border-bottom: 1px solid #dbe7f1;
}

.day-name {
  font-size: 19px;
  font-weight: 800;
  color: #123c69;
}

.day-date {
  font-size: 13px;
  color: #64748b;
  margin-top: 3px;
}

/* =========================
   LESSON
========================= */

.lesson {
  display: grid;
  grid-template-columns: 145px 1fr auto;
  gap: 15px;
  align-items: center;
  padding: 17px 18px;
  border-bottom: 1px solid #edf0f3;
}

.lesson:last-child {
  border-bottom: none;
}

.time {
  font-size: 14px;
  font-weight: 700;
  color: #64748b;
}

.subject {
  font-size: 17px;
  font-weight: 800;
  color: #172033;
}

.teacher {
  font-size: 13px;
  color: #64748b;
  margin-top: 4px;
}

/* =========================
   MEET BUTTON
========================= */

.meet-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  background: #1a73e8;
  color: white;
  text-decoration: none;
  padding: 10px 15px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
}

.meet-btn:hover {
  background: #1558b0;
}

.meet-btn svg {
  width: 17px;
  height: 17px;
}

/* =========================
   EMPTY
========================= */

.empty {
  text-align: center;
  padding: 45px 20px;
  color: #64748b;
  background: white;
  border-radius: 18px;
}

/* =========================
   ERROR
========================= */

.error {
  display: none;
  background: #fff1f2;
  color: #be123c;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 20px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 650px) {

  .header h1 {
    font-size: 23px;
  }

  .lesson {
    grid-template-columns: 1fr auto;
    gap: 8px 10px;
  }

  .time {
    grid-column: 1 / -1;
    font-size: 12px;
    color: #1769aa;
  }

  .subject {
    font-size: 16px;
  }

  .meet-btn {
    padding: 9px 11px;
  }

  .meet-text {
    display: none;
  }

}

</style>
</head>

<body>

<!-- HEADER -->

<header class="header">

  <h1>Jadual PDPR 2026</h1>

  <p>SR Ar Raudhah</p>

</header>


<main class="container">

  <!-- YEAR SELECT -->

  <div class="selector-card">

    <label for="tahun">
      Pilih Tahun
    </label>

    <select id="tahun">

      <option value="">
        -- Pilih Tahun --
      </option>

      <option value="1">
        Tahun 1
      </option>

      <option value="2">
        Tahun 2
      </option>

      <option value="3">
        Tahun 3
      </option>

      <option value="4">
        Tahun 4
      </option>

      <option value="5">
        Tahun 5
      </option>

    </select>

  </div>


  <!-- ERROR -->

  <div id="error" class="error"></div>


  <!-- LOADING -->

  <div id="loading" class="loading">

    <div class="spinner"></div>

    <div>Memuatkan jadual...</div>

  </div>


  <!-- RESULT -->

  <div id="schedule"></div>

</main>


<script>

/* ==========================================
   GOOGLE APPS SCRIPT URL
========================================== */

const API_URL =
  'https://script.google.com/macros/s/AKfycbywivX93mBgSGxm_kqx5RQnPPDPclZowOFp_Q-vxZkh_CTU_rQNmqYNdlo-tsysyCeIVQ/exec';


/* ==========================================
   CACHE
========================================== */

let allData = null;


/* ==========================================
   INITIAL LOAD
========================================== */

document.addEventListener('DOMContentLoaded', function() {

  loadData();

});


/* ==========================================
   YEAR CHANGE
========================================== */

document
  .getElementById('tahun')
  .addEventListener('change', function() {

    const year = this.value;

    if (!year) {

      document
        .getElementById('schedule')
        .innerHTML = '';

      return;

    }

    showYear(year);

  });


/* ==========================================
   LOAD DATA
========================================== */

function loadData() {

  showLoading(true);

  const callbackName =
    'pdprCallback_' + Date.now();

  window[callbackName] = function(response) {

    try {

      if (!response.success) {

        showError(response.error);
        return;

      }

      allData = response.data;

      console.log(
        'PDPR data loaded:',
        allData.length,
        'rows'
      );

    } catch (error) {

      showError(error.message);

    } finally {

      showLoading(false);

      delete window[callbackName];

      const script =
        document.getElementById(callbackName);

      if (script) {
        script.remove();
      }

    }

  };


  const script =
    document.createElement('script');

  script.id = callbackName;

  script.src =
    API_URL +
    '?callback=' +
    callbackName;

  script.onerror = function() {

    showError(
      'Gagal menyambung ke sistem jadual.'
    );

    showLoading(false);

  };

  document.body.appendChild(script);

}


/* ==========================================
   SHOW YEAR
========================================== */

function showYear(year) {

  if (!allData) {

    showError(
      'Data belum selesai dimuatkan.'
    );

    return;

  }

  const rows = allData.slice(2)
    .filter(function(row) {

      return String(row[0]).trim() ===
             String(year).trim();

    });


  const container =
    document.getElementById('schedule');


  if (!rows.length) {

    container.innerHTML = `
      <div class="empty">
        Tiada jadual untuk Tahun ${year}.
      </div>
    `;

    return;

  }


  let html = '';

  rows.forEach(function(row) {

    const hari =
      row[1] || '';

    const tarikh =
      row[2] || '';


    html += `

      <section class="day-card">

        <div class="day-header">

          <div class="day-name">
            ${escapeHTML(hari)}
          </div>

          <div class="day-date">
            ${escapeHTML(tarikh)}
          </div>

        </div>

    `;


    /*
      MATHURAT
      D = 3
      E = 4
    */

    html += lessonHTML(
      '7.00 - 7.20',
      'MATHURAT',
      row[3],
      row[4]
    );


    /*
      SUBJECT 1
      F = 5
      G = 6
      H = 7
    */

    html += lessonHTML(
      '7.40 - 8.30',
      row[5],
      row[6],
      row[7]
    );


    /*
      SUBJECT 2
      I = 8
      J = 9
      K = 10
    */

    html += lessonHTML(
      '8.40 - 9.30',
      row[8],
      row[9],
      row[10]
    );


    /*
      SUBJECT 3
      L = 11
      M = 12
      N = 13
    */

    html += lessonHTML(
      '9.40 - 10.30',
      row[11],
      row[12],
      row[13]
    );


    /*
      SUBJECT 4
      O = 14
      P = 15
      Q = 16
    */

    html += lessonHTML(
      '10.40 - 11.30',
      row[14],
      row[15],
      row[16]
    );


    html += `</section>`;

  });


  container.innerHTML = html;

}


/* ==========================================
   LESSON HTML
========================================== */

function lessonHTML(
  time,
  subject,
  teacher,
  link
) {

  subject =
    String(subject || '').trim();

  teacher =
    String(teacher || '').trim();

  link =
    String(link || '').trim();


  // Don't display completely empty lesson
  if (!subject && !teacher && !link) {
    return '';
  }


  let meetButton = '';


  if (link) {

    meetButton = `

      <a
        class="meet-btn"
        href="${safeURL(link)}"
        target="_blank"
        rel="noopener noreferrer"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >

          <rect
            x="3"
            y="5"
            width="13"
            height="14"
            rx="2"
          ></rect>

          <path
            d="M16 10l5-3v10l-5-3z"
          ></path>

        </svg>

        <span class="meet-text">
          Google Meet
        </span>

      </a>

    `;

  }


  return `

    <div class="lesson">

      <div class="time">
        ${escapeHTML(time)}
      </div>

      <div>

        <div class="subject">
          ${escapeHTML(subject || '-')}
        </div>

        <div class="teacher">
          ${escapeHTML(teacher || '-')}
        </div>

      </div>

      ${meetButton}

    </div>

  `;

}


/* ==========================================
   LOADING
========================================== */

function showLoading(show) {

  document
    .getElementById('loading')
    .style.display =
      show ? 'block' : 'none';

}


/* ==========================================
   ERROR
========================================== */

function showError(message) {

  const el =
    document.getElementById('error');

  el.textContent =
    message;

  el.style.display =
    'block';

}


/* ==========================================
   SECURITY
========================================== */

function escapeHTML(value) {

  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


function safeURL(url) {

  const value =
    String(url).trim();

  if (
    value.startsWith('https://meet.google.com/')
  ) {

    return escapeHTML(value);

  }

  return '#';

}

</script>

</body>
</html>
